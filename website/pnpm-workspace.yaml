  - "@babel/plugin-transform-modules-systemjs@7.29.4"
  - "body-parser@1.20.6"
  - "brace-expansion@1.1.18"
  - "fast-uri@3.1.5"
  - "http-proxy-middleware@3.0.7"
  - "joi@17.13.4"
  - "js-yaml@4.3.1"
  - "launch-editor@2.14.1"
  - "nanoid@3.3.18"
  - "postcss@8.5.26"
  - "qs@6.15.2"
  - "shell-quote@1.10.0"
  - "svgo@3.3.4"
  - "uuid@11.1.1"
  - "webpack-dev-server@5.2.6"
  - "ws@8.21.0"

