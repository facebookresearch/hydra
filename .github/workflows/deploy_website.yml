name: Deploy website

on:
  push:
    branches:
      - main
      - deploy_website_hydra
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy_website.yml
      - website/**
      - tools/landscape/data/decisions.json
      - tools/landscape/build_public_landscape.py


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Build or deploy website
      env:
        WEBSITE_GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && secrets.WEBSITE_GITHUB_TOKEN || '' }}
        IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      run: |
        PATHS=(
          .github/workflows/deploy_website.yml
          website
          tools/landscape/data/decisions.json
          tools/landscape/build_public_landscape.py
        )
        git fetch
        REV=$(git log -5 --pretty=oneline origin/gh-pages | grep "Deploy website" |  awk 'NF>1{print $NF}'  | head -1)
        # This condition passes in 2 conditions:
        # 1. The revision does not exist (squash/force push happened)
        # 2. There are changes between last deployed revision and HEAD
        if [[ ! $(git rev-parse --verify -q "$REV^{commit}") ||  $(git diff-index $REV -- "${PATHS[@]}") ]]; then
          echo "Changes affecting the website were detected between origin/main and this diff"
          cd website
          corepack enable
          corepack pnpm install --frozen-lockfile
          if [[ "$IS_PULL_REQUEST" == "true" ]]; then
            corepack pnpm run build
          else
            git config --global user.email 137557794+meta-hydra-bot@users.noreply.github.com
            git config --global user.name meta-hydra-bot
            WEBSITE_NETRC="$HOME/.netrc"
            trap 'rm -f "$WEBSITE_NETRC"' EXIT
            umask 077
            echo "machine github.com login meta-hydra-bot password $WEBSITE_GITHUB_TOKEN" > "$WEBSITE_NETRC"
            GIT_USER=meta-hydra-bot corepack pnpm run deploy
          fi
        else
          echo "No website changes detected between origin/main and this diff"
        fi
