name: Docusaurus dependency audit

'on':
  schedule:
  - cron: 0 2 * * 1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read
    uses: hydra-ecosystem/github-actions/.github/workflows/docusaurus-audit.yml@0f76d226c783db60ee97bb4937d575c8f9896cf3

  pull-request:
    needs: audit
    permissions:
      contents: write
      pull-requests: write
    uses: hydra-ecosystem/github-actions/.github/workflows/docusaurus-publish.yml@0f76d226c783db60ee97bb4937d575c8f9896cf3
    with:
      validation-passed: ${{ needs.audit.outputs.validation_passed }}
      app-client-id: ${{ vars.DOCUSAURUS_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.DOCUSAURUS_APP_PRIVATE_KEY }}
